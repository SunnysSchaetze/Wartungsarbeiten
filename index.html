<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wartungsarbeiten</title>
<style>
body {
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}
#stars-canvas, #shooting-stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
}
#background-video {
    position: relative;
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    z-index: -1;
}
.category-image {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    max-width: 90%;
    margin: 0 auto;
}
.category-image span { position: absolute; }
.hammer { top: 40px; right: 5px; font-size: 56px; transform-origin: bottom center; animation: hammerHit 0.8s infinite; }
.brick { top: 80px; right: 45px; font-size: 44px; animation: brickBounce 0.6s infinite alternate; }
.wrench { bottom: 5px; right: 20px; font-size: 56px; transform-origin: center center; animation: wrenchTurn 1s infinite; }
.saw { bottom: 15px; left: 15px; font-size: 56px; animation: sawMove 1s infinite alternate; }
.log { bottom: 15px; left: 15px; font-size: 44px; z-index: 10; }
.gear { top: 40px; left: 5px; font-size: 56px; animation: gearTurn 2s linear infinite; transform-origin: center center; }
.small-gear { top: 80px; left: 30px; font-size: 40px; animation: gearTurn 2s linear infinite; transform-origin: center center; }
.screw { bottom: 50px; right: 10px; font-size: 44px; transform-origin: center center; animation: screwSpin 3s linear infinite; }

@keyframes hammerHit { 0%,50%,100%{transform:rotate(0deg);}25%{transform:rotate(-25deg);}75%{transform:rotate(-25deg);} }
@keyframes brickBounce { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
@keyframes wrenchTurn { 0%,50%,100%{transform:rotate(0deg);}25%{transform:rotate(25deg);}75%{transform:rotate(-25deg);} }
@keyframes sawMove { 0%{transform:translateX(0);}100%{transform:translateX(15px);} }
@keyframes gearTurn { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
@keyframes screwSpin { 0%,100%{transform:rotate(0deg);}25%{transform:rotate(10deg);}50%{transform:rotate(-10deg);}75%{transform:rotate(5deg);} }

@media (max-width: 600px) {
    .hammer { font-size: 48px; top: 35px; right: 5px; }
    .brick { font-size: 40px; top: 70px; right: 25px; }
    .wrench { font-size: 48px; bottom: 5px; right: 15px; }
    .saw { font-size: 48px; bottom: 10px; left: 10px; }
    .log { font-size: 40px; bottom: 10px; left: 10px; }
    .gear { font-size: 48px; top: 35px; left: 5px; }
    .small-gear { font-size: 36px; top: 70px; left: 25px; }
    .screw { font-size: 40px; bottom: 40px; right: 5px; }
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="shooting-stars"></canvas>

<div class="category-image">
    <span class="gear">⚙️</span>
    <span class="small-gear">⚙️</span>
    <span class="hammer">🔨</span>
    <span class="brick">🧱</span>
    <span class="wrench">🔧</span>
    <span class="log">🪵</span>
    <span class="saw">🪚</span>
    <span class="screw">🔩</span>

    <video id="background-video" autoplay muted loop playsinline>
        <source src="Sunnys Schätze Wartungsarbeiten Animiert.mp4" type="video/mp4">
        Dein Browser unterstützt dieses Animierte Wartungsarbeitenbild nicht.
    </video>
</div>

<script>
const starCanvas = document.getElementById("stars-canvas");
const starCtx = starCanvas.getContext("2d");
const shootCanvas = document.getElementById("shooting-stars");
const shootCtx = shootCanvas.getContext("2d");

function resizeCanvas() {
    starCanvas.width = shootCanvas.width = window.innerWidth;
    starCanvas.height = shootCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let STAR_COUNT = window.innerWidth < 600 ? 10 : window.innerWidth < 1200 ? 20 : 40;
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({x: Math.random()*starCanvas.width, y: Math.random()*starCanvas.height, size: Math.random()*3+2, hue: Math.random()*360, phase: Math.random()*Math.PI*2, hueSpeed:0.5+Math.random()});
}

function drawStars() {
    starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
    stars.forEach(s=>{
        s.hue += s.hueSpeed*0.1;
        if(s.hue>360) s.hue-=360;
        const alpha=0.65+Math.sin(s.phase+performance.now()/500)*0.35;
        starCtx.shadowColor=`hsla(${s.hue},100%,70%,${alpha})`;
        starCtx.shadowBlur=8;
        starCtx.fillStyle=`hsla(${s.hue},100%,70%,${alpha})`;
        starCtx.beginPath();
        let rot=Math.PI/2*3, spikes=5, outer=s.size, inner=s.size/2;
        starCtx.moveTo(s.x,s.y-outer);
        for(let j=0;j<spikes;j++){
            starCtx.lineTo(s.x+Math.cos(rot)*outer,s.y+Math.sin(rot)*outer);
            rot+=Math.PI/spikes;
            starCtx.lineTo(s.x+Math.cos(rot)*inner,s.y+Math.sin(rot)*inner);
            rot+=Math.PI/spikes;
        }
        starCtx.closePath();
        starCtx.fill();
        s.phase+=0.02;
    });
    requestAnimationFrame(drawStars);
}
drawStars();

class ShootingStar{
    constructor(){this.reset();}
    reset(){
        this.x=Math.random()*shootCanvas.width;
        this.y=Math.random()*-shootCanvas.height;
        this.len=50+Math.random()*100;
        this.speed=0.5+Math.random();
        this.angle=Math.random()*Math.PI/2.5+Math.PI/6;
        this.hue=Math.random()*360;
        this.size=2+Math.random()*2;
        this.endWidth=4+Math.random()*2;
        this.hueSpeed=0.5+Math.random();
    }
    update(){
        this.x-=Math.cos(this.angle)*this.speed;
        this.y+=Math.sin(this.angle)*this.speed;
        this.hue+=this.hueSpeed;
        if(this.hue>360)this.hue-=360;
        if(this.x<-this.len || this.y>shootCanvas.height+this.len)this.reset();
    }
    draw(){
        const endX=this.x,endY=this.y,startX=endX+Math.cos(this.angle)*this.len,startY=endY-Math.sin(this.angle)*this.len;
        shootCtx.beginPath();
        shootCtx.moveTo(startX,startY);
        shootCtx.lineTo(endX+this.endWidth/2,endY);
        shootCtx.lineTo(endX-this.endWidth/2,endY);
        shootCtx.closePath();
        const grad=shootCtx.createLinearGradient(startX,startY,endX,endY);
        grad.addColorStop(0,`hsl(${this.hue},100%,70%)`);
        grad.addColorStop(1,'rgba(0,0,0,0)');
        shootCtx.fillStyle=grad;
        shootCtx.fill();
        shootCtx.shadowColor=`hsl(${this.hue},100%,70%)`;
        shootCtx.shadowBlur=6;
        shootCtx.fillStyle=`hsl(${this.hue},100%,70%)`;
        shootCtx.beginPath();
        let r=Math.PI/2*3,spikes=5,outer=this.size,inner=this.size/2;
        shootCtx.moveTo(endX,endY-outer);
        for(let i=0;i<spikes;i++){
            shootCtx.lineTo(endX+Math.cos(r)*outer,endY+Math.sin(r)*outer);
            r+=Math.PI/spikes;
            shootCtx.lineTo(endX+Math.cos(r)*inner,endY+Math.sin(r)*inner);
            r+=Math.PI/spikes;
        }
        shootCtx.closePath();
        shootCtx.fill();
    }
}

const shootingStars=[];
let maxShoot=window.innerWidth<600?2:window.innerWidth<1200?4:6;
for(let i=0;i<maxShoot;i++) shootingStars.push(new ShootingStar());

function animateShooting(){
    shootCtx.clearRect(0,0,shootCanvas.width,shootCanvas.height);
    shootingStars.forEach(s=>{s.update();s.draw();});
    requestAnimationFrame(animateShooting);
}
animateShooting();
</script>
</body>
</html>
